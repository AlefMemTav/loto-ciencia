site_name: LotoCiencia — Arquitetura e Algoritmos
site_description: Documentação científica da pipeline de geração, validação e backtest de loterias
theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Visão Geral e Filosofia: "#1-visao-geral-e-principios-cientificos"
  - Pipeline de 5 Estágios: "#2-arquitetura-e-pipeline-operacional-5-estagios"
  - Modelagem e Geometria: "#3-modelagem-de-dominio-e-geometria-do-volante"
  - Estatística e Auditoria: "#4-estatistica-descritiva-inferencial-e-auditoria"
  - Sinais Avançados e ML: "#5-sinais-avancados-series-temporais-e-machine-learning"
  - Modelo Nulo e Calibração: "#6-modelo-nulo-combinatorio-e-calibracao-estrutural"
  - Motores de Geração e Portfólio: "#7-motores-de-geracao-funcao-objetivo-e-fechamentos"
  - Validador Independente: "#8-sistema-de-validacao-e-deteccao-de-padroes"
  - Backtest e Bancada Científica: "#9-backtest-walk-forward-modelo-financeiro-e-matriz-de-estrategias"
  - Guia Prático de Uso: "#10-guia-pratico-de-operacao-para-apostas-reais"
