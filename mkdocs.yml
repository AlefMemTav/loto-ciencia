site_name: LotoCiencia — Arquitetura e Algoritmos
site_url: https://alefmemtav.github.io/loto-ciencia/
repo_url: https://github.com/AlefMemTav/loto-ciencia
repo_name: AlefMemTav/loto-ciencia
site_description: Documentação científica da pipeline de geração, validação e backtest de loterias
theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Usar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Usar tema claro

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Documentação técnica: index.md
