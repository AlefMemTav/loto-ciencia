[project]
name = "loto-science"
version = "1.0.0"
description = "Sistema de análise inteligente de jogos de loteria"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Pedro Lucas Garcia", email = "garcia.lucas@aluno.unb.br"}
]

dependencies = [
    "streamlit>=1.52.2",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scipy>=1.14.1",
    "scikit-learn>=1.5.0",
    "requests>=2.32.3",
    "openpyxl>=3.1.5",
    "plotly>=5.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]