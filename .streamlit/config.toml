[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
primaryColor = "#16a34a"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
address = "localhost"
port = 8501
enableStaticServing = true
fileWatcherType = "poll"

[runner]
magicEnabled = true
fastReruns = true

[browser]
gatherUsageStats = false
