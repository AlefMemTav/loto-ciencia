version: "3.8"

services:
  # --- Serviço Backend (API) ---
  backend:
    build: .
    container_name: lotoscience_backend
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ./data:/app/data # Mapeia pasta local 'data' para o container
    env_file:
      - .env
    restart: always

  # --- Serviço Frontend (Streamlit) ---
  frontend:
    build: .
    container_name: lotoscience_frontend
    command: streamlit run main.py --server.port 8501 --server.address 0.0.0.0
    volumes:
      - ./data:/app/data # Precisam ver os mesmos arquivos (DB e Excel)
    env_file:
      - .env
    environment:
      - API_URL=http://backend:8000
      - ENVIRONMENT=production
    ports:
      - "8501:8501" # Abre a porta 8501 para o mundo
    depends_on:
      - backend
    restart: always
